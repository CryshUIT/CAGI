  - "0x66a9893cc07d91d95644aedd05d03f95e1dba8af"  # Uniswap: Universal Router v2 (eth) - xac nhan nhan Etherscan "Uniswap: Universal Router v2", dung boi Cork Protocol seed (execute(), block 22524866)
  - "0x3fc91a3afd70395cd496c647d5a6cc9d4b2b7fad"  # Uniswap: Universal Router (eth, ban khac) - xac nhan nhan Etherscan "Uniswap: Universal Router", dung boi Hedgey Finance seed (internal tx tra ve ETH loi nhuan, block 19688066+)
  # --- Them cho dataset expansion N30 (2026-10-14), xem metadata/protocol_map_N30.yaml ---
